<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Short research updates from across the lab." />
    <title>Labboard — Research updates</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&amp;family=Fragment+Mono&amp;family=Instrument+Serif:ital@0;1&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#" aria-label="Labboard home">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>labboard</span>
      </a>
      <div class="topbar-actions">
        <label class="search" for="search-updates">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
          <span class="sr-only">Filter updates</span>
          <input id="search-updates" type="search" placeholder="Filter updates" autocomplete="off" />
        </label>
        <button class="new-update" id="open-composer" type="button"><span aria-hidden="true">+</span> Share an update</button>
      </div>
    </header>

    <main>
      <section class="board-heading" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">AI research lab · field notes</p>
          <h1 id="page-title">Lab board</h1>
        </div>
        <p class="board-intro">Loose notes on what everyone is reading, trying, and thinking about.</p>
      </section>

      <section class="board" id="people-board" aria-label="Updates grouped by person"></section>

      <p id="no-results" class="no-results" hidden>No updates match that search.</p>
    </main>

    <dialog id="history-dialog" class="history-dialog">
      <div class="history-shell">
        <button class="icon-button history-close" id="close-history" type="button" aria-label="Close">×</button>
        <div id="history-content"></div>
      </div>
    </dialog>

    <dialog id="composer" class="composer">
      <form id="update-form" method="dialog">
        <div class="composer-header">
          <div><p class="eyebrow">New broadcast</p><h2>Share what you’re up to</h2></div>
          <button class="icon-button" id="close-composer" type="button" aria-label="Close">×</button>
        </div>
        <label>Who are you?
          <select name="person" id="person-select" required></select>
        </label>
        <label>Update
          <textarea name="message" rows="5" placeholder="A short note about what you’re doing…" required maxlength="280"></textarea>
          <span class="field-note"><span id="character-count">0</span>/280</span>
        </label>
        <label>Topics <span class="optional">Optional</span><input name="topics" type="text" placeholder="Interpretability, evaluation" maxlength="80" /></label>
        <div class="composer-actions">
          <button class="cancel-button" id="cancel-composer" type="button">Cancel</button>
          <button class="submit-button" type="submit">Post update</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
